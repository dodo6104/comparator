<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Compare for Lenka :)</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #ccc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            min-height: 100vh;
        }

        .top-bar {
            background: #2d6a2d;
            padding: 10px 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: sans-serif;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-label {
            font-family: sans-serif;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #232323;
            color: #ddd;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }
        textarea:focus { border-color: #4a8a4a; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            padding: 7px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            transition: background 0.15s;
        }
        .btn-compare {
            background: #3d8c3d;
            color: white;
            font-weight: bold;
            padding: 8px 32px;
            font-size: 14px;
        }
        .btn-compare:hover { background: #4aaa4a; }
        .btn-secondary { background: #2a2a2a; color: #999; border: 1px solid #444; }
        .btn-secondary:hover { background: #363636; color: #ccc; }

        .hint {
            font-family: sans-serif;
            font-size: 11px;
            color: #555;
            margin-left: 4px;
        }

        .stats-bar {
            display: none;
            padding: 6px 14px;
            margin-bottom: 8px;
            border-left: 3px solid #e07a30;
            background: #222;
            font-family: sans-serif;
            font-size: 13px;
            color: #bbb;
        }
        .stats-bar.identical { border-left-color: #4a9a4a; color: #6abf6a; }

        .diff-container { display: none; }

        .diff-header-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            margin-bottom: 2px;
        }
        .diff-header {
            padding: 5px 12px;
            background: #252f25;
            color: #777;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #2e3e2e;
        }

        .diff-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }
        .diff-panel {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
        }

        .diff-line {
            display: flex;
            min-height: 21px;
            line-height: 21px;
        }
        .line-no {
            min-width: 46px;
            text-align: right;
            padding: 0 8px;
            background: #242424;
            color: #444;
            border-right: 1px solid #2e2e2e;
            user-select: none;
            flex-shrink: 0;
            font-size: 12px;
        }
        .line-text {
            padding: 0 8px;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .line-equal .line-no { color: #4a4a4a; }

        .line-removed { background: #2d1a1a; }
        .line-removed .line-no { background: #261717; color: #6a3535; }

        .line-added { background: #1a2d1a; }
        .line-added .line-no { background: #172617; color: #356a35; }

        .line-empty .line-no { background: #1e1e1e; color: transparent; }
        .line-empty .line-text { background: #222; }

        .hl-del { background: #5c1f1f; color: #ffb3b3; border-radius: 2px; }
        .hl-ins { background: #1f5c1f; color: #b3ffb3; border-radius: 2px; }
    </style>
</head>
<body>

<div class="top-bar">Text Compare for Lenka :)</div>

<div class="container">
    <div class="inputs">
        <div>
            <div class="input-label">Text 1</div>
            <textarea id="t1" placeholder="Vlož prvý text sem..."></textarea>
        </div>
        <div>
            <div class="input-label">Text 2</div>
            <textarea id="t2" placeholder="Vlož druhý text sem..."></textarea>
        </div>
    </div>

    <div class="controls">
        <button class="btn-secondary" onclick="switchTexts()">Switch texts</button>
        <button class="btn-compare" onclick="compare()">Compare!</button>
        <button class="btn-secondary" onclick="clearAll()">Clear all</button>
        <span class="hint">alebo Ctrl+Enter</span>
    </div>

    <div class="stats-bar" id="stats"></div>

    <div class="diff-container" id="diffContainer">
        <div class="diff-header-row">
            <div class="diff-header">Text 1</div>
            <div class="diff-header">Text 2</div>
        </div>
        <div class="diff-body">
            <div class="diff-panel" id="panel1"></div>
            <div class="diff-panel" id="panel2"></div>
        </div>
    </div>
</div>

<script>
    function computeDiff(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({length: m + 1}, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
                dp[i][j] = a[i-1] === b[j-1]
                    ? dp[i-1][j-1] + 1
                    : Math.max(dp[i-1][j], dp[i][j-1]);

        const res = [];
        let i = m, j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
                res.push({type: 'eq', val: a[i-1]});
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                res.push({type: 'ins', val: b[j-1]});
                j--;
            } else {
                res.push({type: 'del', val: a[i-1]});
                i--;
            }
        }
        return res.reverse();
    }

    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function charHighlight(a, b) {
        // Skip char-level diff for very long lines (performance)
        if (a.length + b.length > 3000) {
            return {
                left: `<span class="hl-del">${esc(a)}</span>`,
                right: `<span class="hl-ins">${esc(b)}</span>`
            };
        }
        const ops = computeDiff(a.split(''), b.split(''));
        let L = '', R = '';
        let i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') {
                const ch = esc(ops[i].val);
                L += ch; R += ch;
                i++;
            } else {
                let d = '', ins = '';
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') d += ops[i].val;
                    else ins += ops[i].val;
                    i++;
                }
                if (d)   L += `<span class="hl-del">${esc(d)}</span>`;
                if (ins) R += `<span class="hl-ins">${esc(ins)}</span>`;
            }
        }
        return {left: L, right: R};
    }

    function compare() {
        const t1 = document.getElementById('t1').value;
        const t2 = document.getElementById('t2').value;

        const lines1 = t1.split('\n');
        const lines2 = t2.split('\n');

        let ops;
        if (lines1.length * lines2.length > 400000) {
            // Fallback for very large inputs: simple index-based compare
            ops = [];
            const max = Math.max(lines1.length, lines2.length);
            for (let k = 0; k < max; k++) {
                if (k < lines1.length && k < lines2.length) {
                    if (lines1[k] === lines2[k]) ops.push({type: 'eq', val: lines1[k]});
                    else { ops.push({type: 'del', val: lines1[k]}); ops.push({type: 'ins', val: lines2[k]}); }
                } else if (k < lines1.length) {
                    ops.push({type: 'del', val: lines1[k]});
                } else {
                    ops.push({type: 'ins', val: lines2[k]});
                }
            }
        } else {
            ops = computeDiff(lines1, lines2);
        }

        // Group consecutive del/ins blocks
        const groups = [];
        let i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') {
                groups.push({type: 'eq', val: ops[i].val});
                i++;
            } else {
                const dels = [], ins = [];
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') dels.push(ops[i].val);
                    else ins.push(ops[i].val);
                    i++;
                }
                groups.push({type: 'change', dels, ins});
            }
        }

        const leftRows = [], rightRows = [];
        let ln1 = 1, ln2 = 1, diffCount = 0;

        for (const g of groups) {
            if (g.type === 'eq') {
                leftRows.push({cls: 'line-equal', num: ln1++, html: esc(g.val)});
                rightRows.push({cls: 'line-equal', num: ln2++, html: esc(g.val)});
            } else {
                const max = Math.max(g.dels.length, g.ins.length);
                diffCount += max;
                for (let j = 0; j < max; j++) {
                    const hasDel = j < g.dels.length;
                    const hasIns = j < g.ins.length;
                    if (hasDel && hasIns) {
                        const {left, right} = charHighlight(g.dels[j], g.ins[j]);
                        leftRows.push({cls: 'line-removed', num: ln1++, html: left});
                        rightRows.push({cls: 'line-added', num: ln2++, html: right});
                    } else if (hasDel) {
                        leftRows.push({cls: 'line-removed', num: ln1++, html: esc(g.dels[j])});
                        rightRows.push({cls: 'line-empty', num: '', html: ''});
                    } else {
                        leftRows.push({cls: 'line-empty', num: '', html: ''});
                        rightRows.push({cls: 'line-added', num: ln2++, html: esc(g.ins[j])});
                    }
                }
            }
        }

        function renderRows(rows) {
            return rows.map(r =>
                `<div class="diff-line ${r.cls}"><span class="line-no">${r.num}</span><span class="line-text">${r.html}</span></div>`
            ).join('');
        }

        document.getElementById('panel1').innerHTML = renderRows(leftRows);
        document.getElementById('panel2').innerHTML = renderRows(rightRows);

        const stats = document.getElementById('stats');
        stats.style.display = 'block';
        if (diffCount === 0) {
            stats.textContent = 'Texty sú identické.';
            stats.className = 'stats-bar identical';
        } else {
            stats.textContent = `${diffCount} rozdiel${diffCount === 1 ? '' : diffCount < 5 ? 'y' : 'ov'} nájdených`;
            stats.className = 'stats-bar';
        }
        document.getElementById('diffContainer').style.display = 'block';
    }

    function switchTexts() {
        const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
        [t1.value, t2.value] = [t2.value, t1.value];
    }

    function clearAll() {
        document.getElementById('t1').value = '';
        document.getElementById('t2').value = '';
        document.getElementById('stats').style.display = 'none';
        document.getElementById('diffContainer').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') compare();
    });
</script>

</body>
</html>
