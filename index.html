<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Compare for Lenka :)</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #ccc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            min-height: 100vh;
        }

        .top-bar {
            background: #2d6a2d;
            padding: 10px 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: sans-serif;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-label {
            font-family: sans-serif;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .editor {
            width: 100%;
            min-height: 180px;
            max-height: 400px;
            overflow-y: auto;
            background: #232323;
            color: #ddd;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .editor:focus { border-color: #4a8a4a; }
        .editor:empty::before {
            content: attr(data-ph);
            color: #555;
        }

        .settings {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        .switch-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: sans-serif;
            font-size: 12px;
            color: #999;
            cursor: pointer;
            user-select: none;
        }
        .switch {
            position: relative;
            width: 38px;
            height: 20px;
            background: #3a3a3a;
            border-radius: 10px;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            background: #888;
            border-radius: 50%;
            transition: transform 0.15s, background 0.15s;
        }
        #fmtToggle { display: none; }
        #fmtToggle:checked + .switch { background: #3d8c3d; }
        #fmtToggle:checked + .switch::after { transform: translateX(18px); background: #eaffea; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 7px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            transition: background 0.15s;
        }
        .btn-compare {
            background: #3d8c3d;
            color: white;
            font-weight: bold;
            padding: 8px 32px;
            font-size: 14px;
        }
        .btn-compare:hover { background: #4aaa4a; }
        .btn-secondary { background: #2a2a2a; color: #999; border: 1px solid #444; }
        .btn-secondary:hover { background: #363636; color: #ccc; }

        .hint {
            font-family: sans-serif;
            font-size: 11px;
            color: #555;
            margin-left: 4px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            font-family: sans-serif;
            font-size: 11px;
            color: #777;
        }
        .legend span { display: inline-flex; align-items: center; gap: 5px; }
        .legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

        .stats-bar {
            display: none;
            padding: 6px 14px;
            margin-bottom: 8px;
            border-left: 3px solid #e07a30;
            background: #222;
            font-family: sans-serif;
            font-size: 13px;
            color: #bbb;
        }
        .stats-bar.identical { border-left-color: #4a9a4a; color: #6abf6a; }

        .diff-container { display: none; }

        .diff-header-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            margin-bottom: 2px;
        }
        .diff-header {
            padding: 5px 12px;
            background: #252f25;
            color: #777;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #2e3e2e;
        }

        .diff-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }
        .diff-panel {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
        }

        .diff-line {
            display: flex;
            min-height: 21px;
            line-height: 21px;
        }
        .line-no {
            min-width: 46px;
            text-align: right;
            padding: 0 8px;
            background: #242424;
            color: #444;
            border-right: 1px solid #2e2e2e;
            user-select: none;
            flex-shrink: 0;
            font-size: 12px;
        }
        .line-text {
            padding: 0 8px;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .line-equal .line-no { color: #4a4a4a; }

        .line-removed { background: #2d1a1a; }
        .line-removed .line-no { background: #261717; color: #6a3535; }

        .line-added { background: #1a2d1a; }
        .line-added .line-no { background: #172617; color: #356a35; }

        .line-empty .line-no { background: #1e1e1e; color: transparent; }
        .line-empty .line-text { background: #222; }

        .hl-del { background: #5c1f1f; color: #ffb3b3; border-radius: 2px; }
        .hl-ins { background: #1f5c1f; color: #b3ffb3; border-radius: 2px; }
        .hl-fmt { background: #28386a; color: #bcd0ff; border-radius: 2px; border-bottom: 1px dotted #7d96d6; }

        [data-tip] { cursor: help; }
        #tooltip {
            position: fixed;
            z-index: 1000;
            background: #111;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 9px;
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
            display: none;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.55);
        }
    </style>
</head>
<body>

<div class="top-bar">Text Compare for Lenka :)</div>

<div class="container">
    <div class="inputs">
        <div>
            <div class="input-label">Text 1</div>
            <div class="editor" id="t1" contenteditable="true" data-ph="Vlož prvý text sem..."></div>
        </div>
        <div>
            <div class="input-label">Text 2</div>
            <div class="editor" id="t2" contenteditable="true" data-ph="Vlož druhý text sem..."></div>
        </div>
    </div>

    <div class="settings">
        <label class="switch-label">
            <input type="checkbox" id="fmtToggle">
            <span class="switch"></span>
            Rozpoznávať <b>bold</b>/<i>italic</i>
        </label>
    </div>

    <div class="controls">
        <button class="btn-secondary" onclick="switchTexts()">Switch texts</button>
        <button class="btn-compare" onclick="compare()">Compare!</button>
        <button class="btn-secondary" onclick="clearAll()">Clear all</button>
        <span class="hint">alebo Ctrl+Enter</span>
    </div>

    <div class="legend">
        <span><span class="sw" style="background:#5c1f1f"></span> odstránené</span>
        <span><span class="sw" style="background:#1f5c1f"></span> pridané</span>
        <span id="legendFmt"><span class="sw" style="background:#28386a"></span> zmena formátu (bold/italic)</span>
    </div>

    <div class="stats-bar" id="stats"></div>

    <div class="diff-container" id="diffContainer">
        <div class="diff-header-row">
            <div class="diff-header">Text 1</div>
            <div class="diff-header">Text 2</div>
        </div>
        <div class="diff-body">
            <div class="diff-panel" id="panel1"></div>
            <div class="diff-panel" id="panel2"></div>
        </div>
    </div>
</div>

<div id="tooltip"></div>

<script>
    /* ---------- nastavenie: rozpoznávanie formátu ---------- */
    const STORE_KEY = 'tc_detectFmt';
    let detectFmt = false;
    try { detectFmt = localStorage.getItem(STORE_KEY) === '1'; } catch (e) {}

    /* ---------- generic LCS diff ---------- */
    function computeDiff(a, b, same) {
        same = same || function (x, y) { return x === y; };
        const m = a.length, n = b.length;
        const dp = Array.from({length: m + 1}, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
                dp[i][j] = same(a[i-1], b[j-1])
                    ? dp[i-1][j-1] + 1
                    : Math.max(dp[i-1][j], dp[i][j-1]);

        const res = [];
        let i = m, j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && same(a[i-1], b[j-1])) {
                res.push({type: 'eq', val: a[i-1], val2: b[j-1]});
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                res.push({type: 'ins', val: b[j-1]});
                j--;
            } else {
                res.push({type: 'del', val: a[i-1]});
                i--;
            }
        }
        return res.reverse();
    }

    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    /* ---------- parse contenteditable -> flat styled chars (bold/italic only) ---------- */
    function parseFlat(el) {
        const out = [];
        function lastNL() { return out.length === 0 || out[out.length - 1].ch === '\n'; }
        function walk(node, b, it) {
            node.childNodes.forEach(function (child) {
                if (child.nodeType === 3) {
                    for (const c of child.nodeValue) {
                        if (c === '\n' || c === '\r') continue; // HTML source whitespace, nie reálny riadok
                        out.push({ch: c, b: b, i: it});
                    }
                } else if (child.nodeType === 1) {
                    const tag = child.tagName.toLowerCase();
                    if (tag === 'br') { out.push({ch: '\n', b: false, i: false}); return; }
                    let nb = b, ni = it;
                    if (tag === 'b' || tag === 'strong') nb = true;
                    if (tag === 'i' || tag === 'em') ni = true;
                    const st = child.style;
                    if (st) {
                        const fw = st.fontWeight;
                        if (fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600) nb = true;
                        if (st.fontStyle === 'italic') ni = true;
                    }
                    const block = (tag === 'div' || tag === 'p' || tag === 'li');
                    if (block && out.length > 0 && !lastNL()) out.push({ch: '\n', b: false, i: false});
                    walk(child, nb, ni);
                }
            });
        }
        walk(el, false, false);
        return out;
    }

    function flatToLines(flat) {
        const lines = [[]];
        for (const c of flat) {
            if (c.ch === '\n') lines.push([]);
            else lines[lines.length - 1].push(c);
        }
        while (lines.length > 1 && lines[0].length === 0) lines.shift();
        while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
        return lines;
    }

    function lineSig(chars) {
        if (!detectFmt) return chars.map(c => c.ch).join('');
        return chars.map(c => c.ch + (c.b ? '\u0001' : '') + (c.i ? '\u0002' : '')).join('');
    }

    /* ---------- build clean HTML from styled chars (used on paste) ---------- */
    function buildHtml(flat) {
        let html = '', run = '', cb = false, ci = false, has = false;
        function flush() {
            if (!has) return;
            const open = (cb ? '<b>' : '') + (ci ? '<i>' : '');
            const close = (ci ? '</i>' : '') + (cb ? '</b>' : '');
            html += open + esc(run) + close;
            run = ''; has = false;
        }
        for (const c of flat) {
            if (c.ch === '\n') { flush(); html += '<br>'; continue; }
            if (has && (c.b !== cb || c.i !== ci)) flush();
            if (!has) { cb = c.b; ci = c.i; has = true; }
            run += c.ch;
        }
        flush();
        return html;
    }

    function sanitizeHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return buildHtml(parseFlat(tmp));
    }

    /* ---------- render styled+highlighted chars into a diff panel ---------- */
    function renderRun(arr) {
        let html = '', run = '', cb, ci, ch, ctip, has = false;
        function flush() {
            if (!has) return;
            const cls = ch ? (' class="hl-' + ch + '"') : '';
            const style = (cb ? 'font-weight:700;' : '') + (ci ? 'font-style:italic;' : '');
            const styleAttr = style ? (' style="' + style + '"') : '';
            const tipAttr = ctip ? (' data-tip="' + esc(ctip).replace(/"/g, '&quot;') + '"') : '';
            html += '<span' + cls + styleAttr + tipAttr + '>' + esc(run) + '</span>';
            run = ''; has = false;
        }
        for (const c of arr) {
            if (has && (c.b !== cb || c.i !== ci || c.hl !== ch || (c.tip || '') !== (ctip || ''))) flush();
            if (!has) { cb = c.b; ci = c.i; ch = c.hl; ctip = c.tip; has = true; }
            run += c.ch;
        }
        flush();
        return html;
    }

    function tipFor(hl) {
        if (hl === 'del') return 'Odstránené (je v Text 1, chýba v Text 2)';
        if (hl === 'ins') return 'Pridané (je v Text 2, chýba v Text 1)';
        return '';
    }

    function tag(chars, hl) {
        const t = tipFor(hl);
        return chars.map(c => ({ch: c.ch, b: c.b, i: c.i, hl: hl, tip: t}));
    }

    /* ---------- char-level diff of two lines (text + format) ---------- */
    function diffLine(c1, c2) {
        if (c1.length + c2.length > 3000) {
            return {left: tag(c1, 'del'), right: tag(c2, 'ins')};
        }
        const ops = computeDiff(c1, c2, (x, y) => x.ch === y.ch);
        const left = [], right = [];
        for (const op of ops) {
            if (op.type === 'eq') {
                const a = op.val, b = op.val2;
                const sameFmt = !detectFmt || (a.b === b.b && a.i === b.i);
                let tip = '';
                if (!sameFmt) {
                    const parts = [];
                    if (a.b !== b.b) parts.push(b.b ? 'bold pridaný' : 'bold odstránený');
                    if (a.i !== b.i) parts.push(b.i ? 'italic pridaný' : 'italic odstránený');
                    tip = 'Zmena formátu: ' + parts.join(', ');
                }
                left.push({ch: a.ch, b: a.b, i: a.i, hl: sameFmt ? null : 'fmt', tip: tip});
                right.push({ch: b.ch, b: b.b, i: b.i, hl: sameFmt ? null : 'fmt', tip: tip});
            } else if (op.type === 'del') {
                left.push({ch: op.val.ch, b: op.val.b, i: op.val.i, hl: 'del', tip: tipFor('del')});
            } else {
                right.push({ch: op.val.ch, b: op.val.b, i: op.val.i, hl: 'ins', tip: tipFor('ins')});
            }
        }
        return {left, right};
    }

    /* ---------- main compare ---------- */
    function compare() {
        let lines1 = flatToLines(parseFlat(document.getElementById('t1')));
        let lines2 = flatToLines(parseFlat(document.getElementById('t2')));

        // ak je rozpoznávanie vypnuté, ignorujeme formát úplne
        if (!detectFmt) {
            const strip = ls => ls.map(line => line.map(c => ({ch: c.ch, b: false, i: false})));
            lines1 = strip(lines1);
            lines2 = strip(lines2);
        }

        const L1 = lines1.map(ch => ({chars: ch, sig: lineSig(ch)}));
        const L2 = lines2.map(ch => ({chars: ch, sig: lineSig(ch)}));

        let ops;
        if (L1.length * L2.length > 400000) {
            ops = [];
            const max = Math.max(L1.length, L2.length);
            for (let k = 0; k < max; k++) {
                if (k < L1.length && k < L2.length) {
                    if (L1[k].sig === L2[k].sig) ops.push({type: 'eq', val: L1[k], val2: L2[k]});
                    else { ops.push({type: 'del', val: L1[k]}); ops.push({type: 'ins', val: L2[k]}); }
                } else if (k < L1.length) ops.push({type: 'del', val: L1[k]});
                else ops.push({type: 'ins', val: L2[k]});
            }
        } else {
            ops = computeDiff(L1, L2, (x, y) => x.sig === y.sig);
        }

        const groups = [];
        let i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') { groups.push({type: 'eq', val: ops[i].val}); i++; }
            else {
                const dels = [], ins = [];
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') dels.push(ops[i].val);
                    else ins.push(ops[i].val);
                    i++;
                }
                groups.push({type: 'change', dels, ins});
            }
        }

        const leftRows = [], rightRows = [];
        let ln1 = 1, ln2 = 1, diffCount = 0;

        for (const g of groups) {
            if (g.type === 'eq') {
                const html = renderRun(tag(g.val.chars, null));
                leftRows.push({cls: 'line-equal', num: ln1++, html});
                rightRows.push({cls: 'line-equal', num: ln2++, html});
            } else {
                const max = Math.max(g.dels.length, g.ins.length);
                diffCount += max;
                for (let j = 0; j < max; j++) {
                    const hasDel = j < g.dels.length;
                    const hasIns = j < g.ins.length;
                    if (hasDel && hasIns) {
                        const {left, right} = diffLine(g.dels[j].chars, g.ins[j].chars);
                        leftRows.push({cls: 'line-removed', num: ln1++, html: renderRun(left)});
                        rightRows.push({cls: 'line-added', num: ln2++, html: renderRun(right)});
                    } else if (hasDel) {
                        leftRows.push({cls: 'line-removed', num: ln1++, html: renderRun(tag(g.dels[j].chars, 'del'))});
                        rightRows.push({cls: 'line-empty', num: '', html: ''});
                    } else {
                        leftRows.push({cls: 'line-empty', num: '', html: ''});
                        rightRows.push({cls: 'line-added', num: ln2++, html: renderRun(tag(g.ins[j].chars, 'ins'))});
                    }
                }
            }
        }

        function renderRows(rows) {
            return rows.map(r =>
                `<div class="diff-line ${r.cls}"><span class="line-no">${r.num}</span><span class="line-text">${r.html}</span></div>`
            ).join('');
        }

        document.getElementById('panel1').innerHTML = renderRows(leftRows);
        document.getElementById('panel2').innerHTML = renderRows(rightRows);

        const stats = document.getElementById('stats');
        stats.style.display = 'block';
        if (diffCount === 0) {
            stats.textContent = detectFmt ? 'Texty sú identické (vrátane formátu).' : 'Texty sú identické.';
            stats.className = 'stats-bar identical';
        } else {
            stats.textContent = `${diffCount} rozdiel${diffCount === 1 ? '' : diffCount < 5 ? 'y' : 'ov'} nájdených`;
            stats.className = 'stats-bar';
        }
        document.getElementById('diffContainer').style.display = 'block';
    }

    /* ---------- editory: paste ---------- */
    ['t1', 't2'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('paste', e => {
            e.preventDefault();
            const cd = e.clipboardData || window.clipboardData;
            const html = cd.getData('text/html');
            const text = cd.getData('text/plain');
            let ins;
            if (detectFmt && html) ins = sanitizeHtml(html);
            else ins = esc(text).replace(/\n/g, '<br>');
            document.execCommand('insertHTML', false, ins);
        });
    });

    /* ---------- prepínač ---------- */
    function applyToggleUI() {
        document.getElementById('fmtToggle').checked = detectFmt;
        document.getElementById('legendFmt').style.display = detectFmt ? 'inline-flex' : 'none';
    }

    document.getElementById('fmtToggle').addEventListener('change', function () {
        detectFmt = this.checked;
        try { localStorage.setItem(STORE_KEY, detectFmt ? '1' : '0'); } catch (e) {}
        applyToggleUI();
        if (document.getElementById('diffContainer').style.display === 'block') compare();
    });

    applyToggleUI();

    /* ---------- tooltip pri prejdení myšou ---------- */
    const tooltip = document.getElementById('tooltip');
    const diffContainer = document.getElementById('diffContainer');
    diffContainer.addEventListener('mousemove', e => {
        const el = e.target.closest && e.target.closest('[data-tip]');
        if (el) {
            tooltip.textContent = el.getAttribute('data-tip');
            tooltip.style.display = 'block';
            let x = e.clientX + 12, y = e.clientY + 16;
            const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
            if (x + tw > window.innerWidth - 8) x = e.clientX - tw - 12;
            if (y + th > window.innerHeight - 8) y = e.clientY - th - 16;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        } else {
            tooltip.style.display = 'none';
        }
    });
    diffContainer.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

    function switchTexts() {
        const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
        const tmp = t1.innerHTML;
        t1.innerHTML = t2.innerHTML;
        t2.innerHTML = tmp;
    }

    function clearAll() {
        document.getElementById('t1').innerHTML = '';
        document.getElementById('t2').innerHTML = '';
        document.getElementById('stats').style.display = 'none';
        document.getElementById('diffContainer').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') compare();
    });
</script>

</body>
</html>
