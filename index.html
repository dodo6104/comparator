<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Compare for Lenka :)</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #ccc;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            min-height: 100vh;
        }

        .top-bar {
            background: #2d6a2d;
            padding: 10px 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: sans-serif;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 16px;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-label {
            font-family: sans-serif;
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .text-input {
            width: 100%;
            min-height: 180px;
            max-height: 500px;
            overflow-y: auto;
            background: #232323;
            color: #ddd;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            padding: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .text-input:focus { border-color: #4a8a4a; }
        .text-input em, .text-input i { font-style: italic; }
        .text-input strong, .text-input b { font-weight: bold; }
        .line-text strong { font-weight: bold; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            padding: 7px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            transition: background 0.15s;
        }
        .btn-compare {
            background: #3d8c3d;
            color: white;
            font-weight: bold;
            padding: 8px 32px;
            font-size: 14px;
        }
        .btn-compare:hover { background: #4aaa4a; }
        .btn-secondary { background: #2a2a2a; color: #999; border: 1px solid #444; }
        .btn-secondary:hover { background: #363636; color: #ccc; }

        .hint {
            font-family: sans-serif;
            font-size: 11px;
            color: #555;
            margin-left: 4px;
        }

        .stats-bar {
            display: none;
            padding: 6px 14px;
            margin-bottom: 8px;
            border-left: 3px solid #e07a30;
            background: #222;
            font-family: sans-serif;
            font-size: 13px;
            color: #bbb;
        }
        .stats-bar.identical { border-left-color: #4a9a4a; color: #6abf6a; }

        .diff-container { display: none; }

        .diff-header-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            margin-bottom: 2px;
        }
        .diff-header {
            padding: 5px 12px;
            background: #252f25;
            color: #777;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #2e3e2e;
        }

        .diff-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }
        .diff-panel {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
        }

        .diff-line {
            display: flex;
            min-height: 21px;
            line-height: 21px;
        }
        .line-no {
            min-width: 46px;
            text-align: right;
            padding: 0 8px;
            background: #242424;
            color: #444;
            border-right: 1px solid #2e2e2e;
            user-select: none;
            flex-shrink: 0;
            font-size: 12px;
        }
        .line-text {
            padding: 0 8px;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .line-equal .line-no { color: #4a4a4a; }

        .line-removed { background: #2d1a1a; }
        .line-removed .line-no { background: #261717; color: #6a3535; }

        .line-added { background: #1a2d1a; }
        .line-added .line-no { background: #172617; color: #356a35; }

        .line-empty .line-no { background: #1e1e1e; color: transparent; }
        .line-empty .line-text { background: #222; }

        .hl-del { background: #5c1f1f; color: #ffb3b3; border-radius: 2px; }
        .hl-ins { background: #1f5c1f; color: #b3ffb3; border-radius: 2px; }

        /* italic-only diff: normal line background, purple line number, purple underline on differing words */
        .line-italic-eq .line-no { color: #7b52ab; }
        .hl-italic-diff { border-bottom: 2px solid #9966cc; padding-bottom: 1px; }

        .toggle-wrap {
            display: flex; align-items: center; gap: 5px;
            font-family: sans-serif; font-size: 12px;
            color: #666; cursor: pointer; user-select: none;
        }
        .toggle-wrap:hover { color: #999; }
        .toggle-wrap input { cursor: pointer; accent-color: #7b52ab; }
    </style>
</head>
<body>

<div class="top-bar">Text Compare for Lenka :)</div>

<div class="container">
    <div class="inputs">
        <div>
            <div class="input-label">Text 1</div>
            <div id="t1" class="text-input" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>
        </div>
        <div>
            <div class="input-label">Text 2</div>
            <div id="t2" class="text-input" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-secondary" onclick="switchTexts()">Switch texts</button>
        <button class="btn-compare" onclick="compare()">Compare!</button>
        <button class="btn-secondary" onclick="clearAll()">Clear all</button>
        <label class="toggle-wrap" title="Zapnúť detekciu kurzívy a tučného z formátovaného textu. Rozdiel len v štýle = fialové podčiarknutie na slove.">
            <input type="checkbox" id="htmlItalic"> kurzíva + tučné
        </label>
        <span class="hint">alebo Ctrl+Enter</span>
    </div>

    <div class="stats-bar" id="stats"></div>

    <div class="diff-container" id="diffContainer">
        <div class="diff-header-row">
            <div class="diff-header">Text 1</div>
            <div class="diff-header">Text 2</div>
        </div>
        <div class="diff-body">
            <div class="diff-panel" id="panel1"></div>
            <div class="diff-panel" id="panel2"></div>
        </div>
    </div>
</div>

<script>
    // Keep only italic/bold from pasted HTML, strip everything else
    function sanitizePasteHtml(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        let out = '';
        function walk(node, it, bo) {
            if (node.nodeType === 3) {
                const t = esc(node.textContent);
                if (!t) return;
                if (it && bo) out += `<em><strong>${t}</strong></em>`;
                else if (it)  out += `<em>${t}</em>`;
                else if (bo)  out += `<strong>${t}</strong>`;
                else          out += t;
                return;
            }
            if (node.nodeType !== 1) return;
            const tag = node.tagName.toLowerCase();
            const sty = node.getAttribute('style') || '';
            const ci = it || tag === 'i' || tag === 'em' || /font-style\s*:\s*italic/i.test(sty);
            const cb = bo || tag === 'b' || tag === 'strong' || /font-weight\s*:\s*(bold|[6-9]\d\d|[1-9]\d{3})/i.test(sty);
            if (tag === 'br') { out += '<br>'; return; }
            const isBlock = /^(p|div|li|h[1-6]|blockquote|td|th)$/.test(tag);
            if (isBlock && out && !out.endsWith('<br>')) out += '<br>';
            for (const c of node.childNodes) walk(c, ci, cb);
            if (isBlock && out && !out.endsWith('<br>')) out += '<br>';
        }
        walk(doc.body, false, false);
        return out.replace(/(<br>)+$/, '');
    }

    ['t1', 't2'].forEach(id => {
        document.getElementById(id).addEventListener('paste', e => {
            e.preventDefault();
            const cd = e.clipboardData || window.clipboardData;
            if (document.getElementById('htmlItalic').checked) {
                const html = cd.getData('text/html');
                document.execCommand('insertHTML', false,
                    html ? sanitizePasteHtml(html) : esc(cd.getData('text/plain')));
            } else {
                document.execCommand('insertText', false, cd.getData('text/plain'));
            }
        });
    });

    function computeDiff(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({length: m + 1}, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
                dp[i][j] = a[i-1] === b[j-1]
                    ? dp[i-1][j-1] + 1
                    : Math.max(dp[i-1][j], dp[i][j-1]);

        const res = [];
        let i = m, j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
                res.push({type: 'eq', val: a[i-1]});
                i--; j--;
            } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                res.push({type: 'ins', val: b[j-1]});
                j--;
            } else {
                res.push({type: 'del', val: a[i-1]});
                i--;
            }
        }
        return res.reverse();
    }

    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function charHighlight(a, b) {
        if (a.length + b.length > 3000) {
            return {
                left: `<span class="hl-del">${esc(a)}</span>`,
                right: `<span class="hl-ins">${esc(b)}</span>`
            };
        }
        const ops = computeDiff(a.split(''), b.split(''));
        let L = '', R = '', i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') {
                const ch = esc(ops[i].val);
                L += ch; R += ch;
                i++;
            } else {
                let d = '', ins = '';
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') d += ops[i].val;
                    else ins += ops[i].val;
                    i++;
                }
                if (d)   L += `<span class="hl-del">${esc(d)}</span>`;
                if (ins) R += `<span class="hl-ins">${esc(ins)}</span>`;
            }
        }
        return {left: L, right: R};
    }

    // ---- italic helpers ----

    function parseHtmlLines(html) {
        if (!/<[a-z]/i.test(html)) {
            return html.split('\n').map(line =>
                Array.from(line).map(ch => ({ch, it: false, bo: false}))
            );
        }
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const chars = [];
        function walk(node, it, bo) {
            if (node.nodeType === 3) {
                for (const ch of node.textContent) chars.push({ch, it, bo});
            } else if (node.nodeType === 1) {
                const tag = node.tagName.toLowerCase();
                const sty = node.getAttribute('style') || '';
                const childIt = it || tag === 'i' || tag === 'em'
                             || /font-style\s*:\s*italic/i.test(sty);
                const childBo = bo || tag === 'b' || tag === 'strong'
                             || /font-weight\s*:\s*(bold|[6-9]\d\d|[1-9]\d{3})/i.test(sty);
                const isBlock = /^(p|div|li|h[1-6]|blockquote|td|th)$/.test(tag);
                if (tag === 'br') { chars.push({ch: '\n', it: false, bo: false}); return; }
                // newline before block content so Chrome's "first line + <div>rest</div>" splits correctly
                if (isBlock && chars.length && chars[chars.length - 1].ch !== '\n')
                    chars.push({ch: '\n', it: false, bo: false});
                for (const c of node.childNodes) walk(c, childIt, childBo);
                if (isBlock && chars.length && chars[chars.length - 1].ch !== '\n')
                    chars.push({ch: '\n', it: false, bo: false});
            }
        }
        walk(doc.body, false, false);
        while (chars.length && chars[chars.length - 1].ch === '\n') chars.pop();
        const lines = [];
        let cur = [];
        for (const c of chars) {
            if (c.ch === '\n') { lines.push(cur); cur = []; }
            else cur.push(c);
        }
        lines.push(cur);
        return lines;
    }

    function lineText(arr) { return arr.map(c => c.ch).join(''); }

    // Encode italic+bold as 0-3 mask so LCS detects style-only diffs
    function lineFingerprint(arr) {
        const t = lineText(arr);
        if (!arr.some(c => c.it || c.bo)) return t;
        return t + '\x00' + arr.map(c => (c.it ? 1 : 0) + (c.bo ? 2 : 0)).join('');
    }

    function styledChar(c, ch) {
        if (c.it && c.bo) return `<em><strong>${ch}</strong></em>`;
        if (c.it)         return `<em>${ch}</em>`;
        if (c.bo)         return `<strong>${ch}</strong>`;
        return ch;
    }

    function renderStyledLine(arr) {
        if (!arr.length) return '';
        let html = '', i = 0;
        while (i < arr.length) {
            const it = arr[i].it, bo = arr[i].bo;
            let run = '';
            while (i < arr.length && arr[i].it === it && arr[i].bo === bo)
                run += esc(arr[i++].ch);
            if (it && bo) html += `<em><strong>${run}</strong></em>`;
            else if (it)  html += `<em>${run}</em>`;
            else if (bo)  html += `<strong>${run}</strong>`;
            else          html += run;
        }
        return html;
    }

    function styleDiffTitle(runA, runB) {
        let itDiff = false, boDiff = false;
        for (let k = 0; k < runA.length; k++) {
            if (runA[k].it !== runB[k].it) itDiff = true;
            if (runA[k].bo !== runB[k].bo) boDiff = true;
        }
        const parts = [];
        if (itDiff) parts.push('kurzíva');
        if (boDiff) parts.push('tučné');
        return 'Rozdiel v štýle: ' + parts.join(' + ');
    }

    function charHighlightStyled(a, b) {
        const ta = lineText(a), tb = lineText(b);
        if (ta === tb) {
            // Same text — mark only the spans where style differs
            let L = '', R = '', i = 0;
            while (i < a.length) {
                const same = a[i].it === b[i].it && a[i].bo === b[i].bo;
                let rL = '', rR = '', j = i;
                const runA = [], runB = [];
                while (j < a.length && (a[j].it === b[j].it && a[j].bo === b[j].bo) === same) {
                    const ch = esc(a[j].ch);
                    rL += styledChar(a[j], ch);
                    rR += styledChar(b[j], ch);
                    if (!same) { runA.push(a[j]); runB.push(b[j]); }
                    j++;
                }
                if (same) { L += rL; R += rR; }
                else {
                    const title = styleDiffTitle(runA, runB);
                    L += `<span class="hl-italic-diff" title="${title}">${rL}</span>`;
                    R += `<span class="hl-italic-diff" title="${title}">${rR}</span>`;
                }
                i = j;
            }
            return { left: L, right: R, styleOnly: true };
        }
        if (ta.length + tb.length > 3000) {
            return {
                left: `<span class="hl-del">${renderStyledLine(a)}</span>`,
                right: `<span class="hl-ins">${renderStyledLine(b)}</span>`,
                styleOnly: false
            };
        }
        const ops = computeDiff(ta.split(''), tb.split(''));
        let L = '', R = '', ai = 0, bi = 0, i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') {
                const ch = esc(ops[i].val);
                L += styledChar(a[ai] || {it:false,bo:false}, ch);
                R += styledChar(b[bi] || {it:false,bo:false}, ch);
                ai++; bi++; i++;
            } else {
                const dArr = [], iArr = [];
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') dArr.push(a[ai++]);
                    else iArr.push(b[bi++]);
                    i++;
                }
                if (dArr.length) L += `<span class="hl-del">${renderStyledLine(dArr)}</span>`;
                if (iArr.length) R += `<span class="hl-ins">${renderStyledLine(iArr)}</span>`;
            }
        }
        return { left: L, right: R, styleOnly: false };
    }

    // ---- end italic helpers ----

    function getInputText(id) {
        return (document.getElementById(id).innerText || '').replace(/\n$/, '');
    }

    function compare() {
        const useItalic = document.getElementById('htmlItalic').checked;

        let lines1, lines2, parsed1, parsed2;
        if (useItalic) {
            parsed1 = parseHtmlLines(document.getElementById('t1').innerHTML);
            parsed2 = parseHtmlLines(document.getElementById('t2').innerHTML);
            lines1 = parsed1.map(lineFingerprint);
            lines2 = parsed2.map(lineFingerprint);
        } else {
            lines1 = getInputText('t1').split('\n');
            lines2 = getInputText('t2').split('\n');
        }

        let ops;
        if (lines1.length * lines2.length > 400000) {
            ops = [];
            const max = Math.max(lines1.length, lines2.length);
            let ci1 = 0, ci2 = 0;
            for (let k = 0; k < max; k++) {
                if (k < lines1.length && k < lines2.length) {
                    if (lines1[k] === lines2[k]) ops.push({type: 'eq', val: lines1[k], i1: ci1++, i2: ci2++});
                    else { ops.push({type: 'del', val: lines1[k], i1: ci1++}); ops.push({type: 'ins', val: lines2[k], i2: ci2++}); }
                } else if (k < lines1.length) {
                    ops.push({type: 'del', val: lines1[k], i1: ci1++});
                } else {
                    ops.push({type: 'ins', val: lines2[k], i2: ci2++});
                }
            }
        } else {
            const raw = computeDiff(lines1, lines2);
            ops = [];
            let ci1 = 0, ci2 = 0;
            for (const op of raw) {
                if (op.type === 'eq')       ops.push({...op, i1: ci1++, i2: ci2++});
                else if (op.type === 'del') ops.push({...op, i1: ci1++});
                else                        ops.push({...op, i2: ci2++});
            }
        }

        const groups = [];
        let i = 0;
        while (i < ops.length) {
            if (ops[i].type === 'eq') {
                groups.push({type: 'eq', val: ops[i].val, i1: ops[i].i1, i2: ops[i].i2});
                i++;
            } else {
                const dels = [], ins = [], di = [], ii = [];
                while (i < ops.length && ops[i].type !== 'eq') {
                    if (ops[i].type === 'del') { dels.push(ops[i].val); di.push(ops[i].i1); }
                    else                       { ins.push(ops[i].val);  ii.push(ops[i].i2); }
                    i++;
                }
                groups.push({type: 'change', dels, ins, di, ii});
            }
        }

        const leftRows = [], rightRows = [];
        let ln1 = 1, ln2 = 1, diffCount = 0, italicDiffCount = 0;

        for (const g of groups) {
            if (g.type === 'eq') {
                const h1 = useItalic ? renderStyledLine(parsed1[g.i1]) : esc(g.val);
                const h2 = useItalic ? renderStyledLine(parsed2[g.i2]) : esc(g.val);
                leftRows.push({cls: 'line-equal', num: ln1++, html: h1});
                rightRows.push({cls: 'line-equal', num: ln2++, html: h2});
            } else {
                const max = Math.max(g.dels.length, g.ins.length);
                for (let j = 0; j < max; j++) {
                    const hasDel = j < g.dels.length;
                    const hasIns = j < g.ins.length;
                    if (hasDel && hasIns) {
                        if (useItalic) {
                            const res = charHighlightStyled(parsed1[g.di[j]], parsed2[g.ii[j]]);
                            if (res.styleOnly) {
                                italicDiffCount++;
                                leftRows.push({cls: 'line-italic-eq', num: ln1++, html: res.left});
                                rightRows.push({cls: 'line-italic-eq', num: ln2++, html: res.right});
                            } else {
                                diffCount++;
                                leftRows.push({cls: 'line-removed', num: ln1++, html: res.left});
                                rightRows.push({cls: 'line-added', num: ln2++, html: res.right});
                            }
                        } else {
                            diffCount++;
                            const {left, right} = charHighlight(g.dels[j], g.ins[j]);
                            leftRows.push({cls: 'line-removed', num: ln1++, html: left});
                            rightRows.push({cls: 'line-added', num: ln2++, html: right});
                        }
                    } else if (hasDel) {
                        diffCount++;
                        const html = useItalic ? renderStyledLine(parsed1[g.di[j]]) : esc(g.dels[j]);
                        leftRows.push({cls: 'line-removed', num: ln1++, html});
                        rightRows.push({cls: 'line-empty', num: '', html: ''});
                    } else {
                        diffCount++;
                        const html = useItalic ? renderStyledLine(parsed2[g.ii[j]]) : esc(g.ins[j]);
                        leftRows.push({cls: 'line-empty', num: '', html: ''});
                        rightRows.push({cls: 'line-added', num: ln2++, html});
                    }
                }
            }
        }

        function renderRows(rows) {
            return rows.map(r =>
                `<div class="diff-line ${r.cls}"><span class="line-no">${r.num}</span><span class="line-text">${r.html}</span></div>`
            ).join('');
        }

        document.getElementById('panel1').innerHTML = renderRows(leftRows);
        document.getElementById('panel2').innerHTML = renderRows(rightRows);

        const stats = document.getElementById('stats');
        stats.style.display = 'block';
        const total = diffCount + italicDiffCount;
        if (total === 0) {
            stats.textContent = 'Texty sú identické.';
            stats.className = 'stats-bar identical';
        } else {
            const parts = [];
            if (diffCount > 0)
                parts.push(`${diffCount} textový${diffCount === 1 ? '' : diffCount < 5 ? 'e' : 'ch'} rozdiel${diffCount === 1 ? '' : diffCount < 5 ? 'y' : 'ov'}`);
            if (italicDiffCount > 0)
                parts.push(`${italicDiffCount} rozdiel${italicDiffCount === 1 ? '' : italicDiffCount < 5 ? 'y' : 'ov'} v štýle`);
            stats.textContent = parts.join(', ') + ' nájdených';
            stats.className = 'stats-bar';
        }
        document.getElementById('diffContainer').style.display = 'block';
    }

    function switchTexts() {
        const t1 = document.getElementById('t1'), t2 = document.getElementById('t2');
        const h = t1.innerHTML;
        t1.innerHTML = t2.innerHTML;
        t2.innerHTML = h;
    }

    function clearAll() {
        document.getElementById('t1').innerHTML = '';
        document.getElementById('t2').innerHTML = '';
        document.getElementById('stats').style.display = 'none';
        document.getElementById('diffContainer').style.display = 'none';
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') compare();
    });

    const toggle = document.getElementById('htmlItalic');
    toggle.checked = localStorage.getItem('styleToggle') === '1';
    toggle.addEventListener('change', () => localStorage.setItem('styleToggle', toggle.checked ? '1' : '0'));
</script>

</body>
</html>
